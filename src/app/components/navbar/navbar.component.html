<header class="editorial-header">
  <div class="site-container header-inner">
    <a routerLink="/home" class="brand-name">
      Nikita Jaiswal
    </a>

    <nav class="nav-cluster">
      <a routerLink="/projects" routerLinkActive="active" class="nav-link-item">Projects</a>
      <a routerLink="/skills" routerLinkActive="active" class="nav-link-item">Skills</a>
      <a routerLink="/about" routerLinkActive="active" class="nav-link-item">About</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link-item">Contact</a>

      <button 
        type="button" 
        class="theme-toggle" 
        (click)="toggleTheme()" 
        [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
        <i class="fas" [ngClass]="isDark ? 'fa-sun' : 'fa-moon'"></i>
      </button>
    </nav>
  </div>
</header>
