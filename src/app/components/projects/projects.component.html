<main class="site-container editorial-page">

  <!-- Projects Header -->
  <header class="projects-hero">
    <h1 class="projects-page-title">Projects</h1>
    <p class="projects-page-intro">
      A collection of software development, web application, and machine learning projects I have built and explored.
    </p>
  </header>

  <hr class="divider" />

  <!-- Projects List Section -->
  <section class="projects-list-section">
    <div class="numbered-index">
      
      <article class="index-entry" *ngFor="let project of projects">
        <div class="index-num font-mono">{{ project.num }}</div>
        
        <div class="index-content">
          <div class="index-header">
            <h2 class="index-title">
              <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener noreferrer">
                {{ project.title }}
              </a>
              <span *ngIf="!project.liveUrl">{{ project.title }}</span>
            </h2>
            <span class="index-subtle-tag">{{ project.tech }}</span>
          </div>
          <p class="index-summary">{{ project.summary }}</p>
        </div>

        <div class="index-action">
          <div class="index-links">
            <a 
              *ngIf="project.liveUrl" 
              [href]="project.liveUrl" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="index-link" 
              [attr.aria-label]="'Open ' + project.title + ' live demo'">
              <span>Live demo</span> <span class="arrow">&nearr;</span>
            </a>
            <a 
              *ngIf="project.githubUrl" 
              [href]="project.githubUrl" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="index-link" 
              [attr.aria-label]="'View ' + project.title + ' source on GitHub'">
              <span>GitHub</span> <span class="arrow">&nearr;</span>
            </a>
          </div>
        </div>
      </article>

    </div>
  </section>

</main>
