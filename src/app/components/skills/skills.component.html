<main class="site-container editorial-page">

  <!-- Skills Hero / Header -->
  <header class="skills-hero">
    <h1 class="skills-page-title">Skills</h1>
    <p class="skills-page-intro">
      Technologies, frameworks, and tools I use to build software, web applications, and data-driven projects.
    </p>
  </header>

  <hr class="divider" />

  <!-- Categories Section -->
  <div class="skills-container">
    <section class="skill-category-block" *ngFor="let group of skillCategories; let last = last">
      <div class="category-header">
        <h2 class="category-title">{{ group.category }}</h2>
      </div>

      <div class="skills-grid">
        <div class="skill-item" *ngFor="let skill of group.skills">
          <div class="skill-icon-wrap" aria-hidden="true">
            <img 
              [src]="skill.icon" 
              [alt]="skill.name + ' logo'" 
              class="skill-logo" 
              [class.skill-logo-adaptive]="skill.adaptive"
              [class.skill-logo-pandas]="skill.isPandas"
              width="20" 
              height="20" 
              loading="lazy" />
          </div>
          <span class="skill-name">{{ skill.name }}</span>
        </div>
      </div>

      <hr class="category-divider" *ngIf="!last" />
    </section>
  </div>

</main>
