<!doctype html>

    <!-- Theme flash prevention script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph (OG) Tags for Social Media -->
    <meta property="og:title" content="Nikita Jaiswal — Information Technology Engineering Student" />
    <meta property="og:description" content="Personal portfolio of Nikita Jaiswal, an Information Technology engineering student building web applications and exploring software development." />
